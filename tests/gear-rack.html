<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gear rack commit counter (#81)</title></head>
<body style="margin:0;background:#020617;padding:16px">
  <div id="root" style="max-width:640px;margin:auto"></div>
  <script type="module">
    // Dev harness: counts React commits of the inspector rack gear. Read window.__commits.
    import React, { Profiler } from 'react';
    import { createRoot } from 'react-dom/client';
    import { InteractiveStudioRackGear } from '/src/features/gearStudio/index.ts';
    import '/src/index.css';
    window.__commits = 0;
    createRoot(document.getElementById('root')).render(
      React.createElement(Profiler, { id: 'rack', onRender: () => { window.__commits += 1; } },
        React.createElement(InteractiveStudioRackGear, {})));
  </script>
</body>
</html>
