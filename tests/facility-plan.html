<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Facility plan harness</title></head>
<body style="margin:0;background:#1c1410">
  <div id="root" style="position:relative;width:100vw;height:100vh"></div>
  <script type="module">
    // Dev harness: the facility blueprint with a mid-game set of rooms (?all=1 unlocks every room).
    import '/src/index.css';
    import '/src/styles/feel.css';
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { FacilityMap } from '/src/components/studio/FacilityMap.tsx';
    import { createDefaultStudioRooms } from '/src/utils/studioRoomUtils.ts';
    const q = new URLSearchParams(location.search);
    const rooms = createDefaultStudioRooms().map((r) => (q.get('all') === '1' || r.id === 'vocal-suite' || r.id === 'live-room' ? { ...r, unlocked: true } : r));
    createRoot(document.getElementById('root')).render(
      React.createElement(FacilityMap, { rooms, activeId: q.get('active') ?? 'studio-a', occupied: new Set(['live-room']), premisesTier: 2, playerLevel: 6, onSelect: (id) => { window.__picked = id; } }));
  </script>
</body>
</html>
