<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="26%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="51%" stop-color="#090d16"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="76%" stop-color="#090d16"/>
      <stop offset="98%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background sleeve -->
  <rect width="1200" height="1200" fill="url(#bg)" rx="16"/>
  
  <!-- Outer border -->
  <rect x="24" y="24" width="1152" height="1152" rx="12" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Concentric Vinyl in Center -->
  <circle cx="600" cy="540" r="380" fill="url(#vinyl)" stroke="#475569" stroke-width="6"/>
  <circle cx="600" cy="540" r="320" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="600" cy="540" r="260" stroke="#334155" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="600" cy="540" r="200" stroke="#334155" stroke-width="2" opacity="0.6"/>
  
  <!-- Sheen wedge -->
  <path d="M600 540 L940 340 A380 380 0 0 0 740 180 Z" fill="url(#sheen)"/>
  <path d="M600 540 L260 740 A380 380 0 0 0 460 900 Z" fill="url(#sheen)"/>

  <!-- Center Label -->
  <circle cx="600" cy="540" r="140" fill="url(#gold)"/>
  <circle cx="600" cy="540" r="130" fill="#0f172a" stroke="#d97706" stroke-width="4"/>
  <circle cx="600" cy="540" r="24" fill="#020617" stroke="#f59e0b" stroke-width="3"/>

  <!-- Studio Label Text -->
  <text x="600" y="490" text-anchor="middle" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4">RECORDING STUDIO</text>
  <text x="600" y="520" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="6">TYCOON</text>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="2">33⅓ RPM • STEREO</text>

  <!-- Bottom Title Banner -->
  <rect x="120" y="980" width="960" height="120" rx="12" fill="#090d16" fill-opacity="0.8" stroke="#334155" stroke-width="2"/>
  <text x="600" y="1035" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" letter-spacing="2">STUDIO MASTER RECORDING</text>
  <text x="600" y="1075" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="4">ORIGINAL PRODUCTION</text>
</svg>